<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>D3 Zoomable Sunburst from CSV</title>
  <script src="https://d3js.org/d3.v4.min.js"></script>
  <style>
    body { margin: 0; }
  </style>
</head>
<body>
  <div id="chart"></div>
  <script>
    // CSVデータを直接文字列として定義
    const csvData = `id,parent,name,value
0,,Root,
1,0,Category A,
2,0,Category B,
3,0,Category C,
4,1,Subcategory A1,10
5,1,Subcategory A2,15
6,2,Subcategory B1,20
7,2,Subcategory B2,25
8,3,Subcategory C1,30
9,3,Subcategory C2,35
10,4,Item A1-1,5
11,4,Item A1-2,5
12,5,Item A2-1,7
13,5,Item A2-2,8
14,6,Item B1-1,10
15,6,Item B1-2,10
16,7,Item B2-1,12
17,7,Item B2-2,13
18,8,Item C1-1,15
19,8,Item C1-2,15
20,9,Item C2-1,17
21,9,Item C2-2,18`;

    // SVGの設定
    const width = 800;
    const height = 800;
    const radius = Math.min(width, height) / 2;

    const svg = d3.select("#chart")
      .append("svg")
      .attr("width", width)
      .attr("height", height)
      .append("g")
      .attr("transform", `translate(${width / 2},${height / 2})`);

    // カラースケールの設定
    const color = d3.scaleOrdinal(d3.schemeCategory10);

    // パーティションレイアウトの設定
    const partition = d3.partition()
      .size([2 * Math.PI, radius]);

    // アーク生成関数の設定
    const arc = d3.arc()
      .startAngle(d => d.x0)
      .endAngle(d => d.x1)
      .innerRadius(d => d.y0)
      .outerRadius(d => d.y1);

    // CSVデータの解析と階層構造の作成
    d3.csvParse(csvData, d3.autoType).then(data => {
      const root = d3.stratify()
        .id(d => d.id)
        .parentId(d => d.parent)
        (data)
        .sum(d => d.value)
        .sort((a, b) => b.value - a.value);

      // パーティションレイアウトの適用
      partition(root);

      // パスの描画
      const path = svg.selectAll("path")
        .data(root.descendants().filter(d => d.depth))
        .enter().append("path")
        .attr("d", arc)
        .style("fill", d => color((d.children ? d : d.parent).data.name))
        .style("opacity", 0.8)
        .style("stroke", "white")
        .style("stroke-width", "0.5px")
        .on("click", click);

      // テキストラベルの追加
      const text = svg.selectAll("text")
        .data(root.descendants().filter(d => d.depth && (d.y0 + d.y1) / 2 * (d.x1 - d.x0) > 10))
        .enter().append("text")
        .attr("transform", function(d) {
          const x = (d.x0 + d.x1) / 2 * 180 / Math.PI;
          const y = (d.y0 + d.y1) / 2;
          return `rotate(${x - 90}) translate(${y},0) rotate(${x < 180 ? 0 : 180})`;
        })
        .attr("dy", "0.35em")
        .text(d => d.data.name)
        .style("font-size", "10px")
        .style("text-anchor", "middle")
        .style("fill", "white");

      // クリックイベントハンドラ
      function click(p) {
        svg.transition().duration(750).tween("scale", function() {
          const xd = d3.interpolate(x.domain(), [p.x0, p.x1]),
                yd = d3.interpolate(y.domain(), [p.y0, 1]),
                yr = d3.interpolate(y.range(), [p.y0 ? 20 : 0, radius]);
          return t => { x.domain(xd(t)); y.domain(yd(t)).range(yr(t)); };
        }).selectAll("path")
          .attrTween("d", d => () => arc(d));
      }

      // スケールの設定
      const x = d3.scaleLinear().range([0, 2 * Math.PI]);
      const y = d3.scaleLinear().range([0, radius]);
    });
  </script>
</body>
</html>
