<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Zoomable Sunburst</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        #chart {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="chart"></div>
    <script>
        // CSVファイルを読み込む関数
        function loadCSV(callback) {
            d3.csv("data.csv").then(function(data) {
                callback(data);
            }).catch(function(error) {
                console.error("CSVファイルの読み込みに失敗しました:", error);
            });
        }

        // データを階層構造に変換する関数
        function createHierarchy(data) {
            const root = { name: "root", children: [] };
            const dataMap = new Map();

            data.forEach(d => {
                d.size = +d.size;
                dataMap.set(d.id, d);
            });

            data.forEach(d => {
                const parent = dataMap.get(d.parentId) || root;
                if (!parent.children) parent.children = [];
                parent.children.push(d);
            });

            return d3.hierarchy(root);
        }

        // メイン関数
        function createChart() {
            loadCSV(function(csvData) {
                const width = window.innerWidth;
                const height = window.innerHeight;
                const radius = Math.min(width, height) / 2;

                const hierarchyData = createHierarchy(csvData);

                const color = d3.scaleOrdinal(d3.quantize(d3.interpolateRainbow, hierarchyData.children.length + 1));

                const partition = data => d3.partition()
                    .size([2 * Math.PI, radius])
                    (d3.hierarchy(data)
                        .sum(d => d.size)
                        .sort((a, b) => b.value - a.value));

                const arc = d3.arc()
                    .startAngle(d => d.x0)
                    .endAngle(d => d.x1)
                    .padAngle(d => Math.min((d.x1 - d.x0) / 2, 0.005))
                    .padRadius(radius / 2)
                    .innerRadius(d => d.y0)
                    .outerRadius(d => d.y1 - 1);

                const root = partition(hierarchyData);

                const svg = d3.select("#chart")
                    .append("svg")
                    .attr("viewBox", [-width / 2, -height / 2, width, height])
                    .style("font", "10px sans-serif");

                svg.append("g")
                    .selectAll("path")
                    .data(root.descendants().filter(d => d.depth))
                    .join("path")
                    .attr("fill", d => { while (d.depth > 1) d = d.parent; return color(d.data.name); })
                    .attr("fill-opacity", d => arcVisible(d.current) ? (d.children ? 0.6 : 0.4) : 0)
                    .attr("d", d => arc(d.current));

                svg.append("g")
                    .attr("pointer-events", "none")
                    .attr("text-anchor", "middle")
                    .attr("font-size", 10)
                    .attr("fill-opacity", 0.6)
                    .selectAll("text")
                    .data(root.descendants().filter(d => d.depth && (d.y0 + d.y1) / 2 * (d.x1 - d.x0) > 10))
                    .join("text")
                    .attr("transform", function(d) {
                        const x = (d.x0 + d.x1) / 2 * 180 / Math.PI;
                        const y = (d.y0 + d.y1) / 2;
                        return `rotate(${x - 90}) translate(${y},0) rotate(${x < 180 ? 0 : 180})`;
                    })
                    .attr("dy", "0.35em")
                    .text(d => d.data.name);

                svg.on("click", clicked);

                function clicked(event, p) {
                    svg.transition().duration(750).tween("scale", () => {
                        const xd = d3.interpolate(x.domain(), [p.x0, p.x1]);
                        const yd = d3.interpolate(y.domain(), [p.y0, 1]);
                        const yr = d3.interpolate(y.range(), [p.y0 ? 20 : 0, radius]);
                        return t => { x.domain(xd(t)); y.domain(yd(t)).range(yr(t)); };
                    }).selectAll("path")
                    .attrTween("d", d => () => arc(d.current));
                }

                function arcVisible(d) {
                    return d.y1 <= 3 && d.y0 >= 1 && d.x1 > d.x0;
                }
            });
        }

        createChart();
    </script>
</body>
</html>
